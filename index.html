<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIE Scorecard</title>

    <!-- Tailwind CSS & FontAwesome via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Firebase Web SDK (v10 Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="Style.css?v=3">

    <!-- Favicon / App-Icon -->
    <link rel="icon" type="image/jpeg" href="img/LIE_Logo II.jpeg">
    <link rel="apple-touch-icon" href="img/LIE_Logo II.jpeg">

    <!-- PWA Manifest & Mobile Styling -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LIE Scorecard">
</head>
<body class="bg-zinc-100 text-zinc-900 font-sans antialiased">

    <!-- Globale Namespace Initialisierung -->
    <script>
        window.app = window.app || {};
        app.views = app.views || {};
        app.logic = app.logic || {};
        app.router = app.router || {};
    </script>

    <!-- App Shell Wrapper -->
    <div class="w-full max-w-md md:max-w-2xl lg:max-w-4xl mx-auto min-h-screen bg-white shadow-2xl border-x border-zinc-200/60">
        
        <!-- Header in Clean Tech Emerald -->
        <header class="bg-emerald-900 text-white px-4 py-3 sticky top-0 z-40 shadow-md flex justify-between items-center border-b border-emerald-800/80">
            <div class="flex items-center space-x-2.5">
                <h1 class="text-lg font-black tracking-wider uppercase text-emerald-50">LIE Scorecard</h1>
                
                <!-- Firebase-Indicator Badge -->
                <span class="flex items-center gap-1 bg-emerald-950/80 border border-emerald-600/50 px-2 py-0.5 rounded-full text-[10px] font-bold text-amber-300 shadow-xs" title="Firebase Backend aktiv">
                    <svg class="w-3 h-3 fill-amber-400" viewBox="0 0 24 24">
                        <path d="M3.89 15.672L6.255.461A.542.542 0 0 1 7.27.283l2.543 4.772-5.923 10.617zM13.5 11.235l-2.22-4.18-8.23 14.868 10.45-10.688zM20.11 21.923L14.49 13.1l-1.01 1.034 6.63 7.789a.544.544 0 0 0 .866-.027zM20.592 7.641l-1.874-3.551a.543.543 0 0 0-.962.008L3.218 21.848l8.608 4.887a1.63 1.63 0 0 0 1.572 0l8.608-4.887a.543.543 0 0 0 .237-.624l-1.651-13.583z"/>
                    </svg>
                    <span class="tracking-tight text-[9px] uppercase">Firestore</span>
                </span>
            </div>

            <div class="flex items-center space-x-3">
                <button id="global-refresh-btn" onclick="app.logic.refreshGlobalAppData()" class="text-white p-1 touch-target text-base opacity-80 hover:opacity-100 transition focus:outline-none" title="Daten aktualisieren">
                    <i id="global-refresh-icon" class="fas fa-sync-alt"></i>
                </button>
                <button id="header-action-btn" onclick="app.router.navigate('spieltag_neu')" class="hidden text-white p-1 touch-target text-lg" title="Runde anlegen">
                    <i class="fas fa-plus-circle"></i>
                </button>
                <span id="header-role-badge" class="flex items-center text-xs opacity-75"></span>
                <button id="header-logout-btn" onclick="app.logic.logout()" class="hidden text-white opacity-80 hover:opacity-100 p-1 touch-target text-sm transition focus:outline-none" title="Abmelden">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
                <div id="connection-status" class="w-3 h-3 rounded-full bg-emerald-400 shadow-xs"></div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-container" class="flex-1 p-4 pb-24">
            <!-- Splash Screen -->
            <div id="app-loading" class="flex flex-col items-center justify-center pt-16 space-y-6">
                <div class="w-44 h-44 bg-zinc-50 border border-zinc-200 rounded-3xl p-2 shadow-lg flex items-center justify-center overflow-hidden">
                    <img id="splash-logo" src="img/LIE_Logo II.jpeg" alt="LIE Logo" class="w-full h-full object-cover rounded-2xl" />
                </div>
                <div class="flex flex-col items-center space-y-2">
                    <i class="fas fa-circle-notch fa-spin text-2xl text-emerald-600"></i>
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest">Lade Clubhaus-Daten...</p>
                </div>
            </div>
        </main>

        <!-- Mobile Navigation Footer -->
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-zinc-200/80 py-2 px-3 flex justify-around items-center z-40 shadow-xl hidden">
            <button id="nav-dash" onclick="app.router.navigate('dashboard')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-emerald-700 transition px-2 py-1 touch-target">
                <i class="fas fa-home text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Home</span>
            </button>
            <button id="nav-rounds" onclick="app.router.navigate('spieltage')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-emerald-700 transition px-2 py-1 touch-target">
                <i class="fas fa-calendar-alt text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Runden</span>
            </button>
            <button id="nav-players" onclick="app.router.navigate('spieler')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-emerald-700 transition px-2 py-1 touch-target">
                <i class="fas fa-users text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Gruppe</span>
            </button>
            <button id="nav-help" onclick="app.router.navigate('help')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-emerald-700 transition px-2 py-1 touch-target">
                <i class="fas fa-question-circle text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Hilfe</span>
            </button>
            <button id="nav-admin" onclick="app.router.navigate('admin')" class="nav-btn flex flex-col items-center text-zinc-400 hover:text-amber-600 transition px-2 py-1 touch-target hidden">
                <i class="fas fa-user-shield text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Admin</span>
            </button>
        </nav>

    </div>

    <!-- Globaler Toast Container -->
    <div id="global-toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <!-- Dynamisches Skript-Laden -->
    <script>
        (function() 
        {
            const cfgScript = document.createElement('script');
            cfgScript.src = 'config.js?t=' + Date.now();
            cfgScript.async = false;

            cfgScript.onload = function() 
            {
                const scripts = [
                    "App_Core.js",
                    "App_View_Help.js",
                    "App_Router.js",
                    "App_Logic_Bridge.js",
                    "App_Logic_Scores.js",
                    "App_Logic_Spieltage.js",
                    "App_Logic_Spieler.js",
                    "App_Logic_UI.js",
                    "Views_Login.js",
                    "Views_Dashboard.js",
                    "Views_Spieltage.js",
                    "Views_SpieltagNeu.js",
                    "Views_ScoreEingabe.js",
                    "Views_Leaderboard.js",
                    "Views_Admin.js",
                    "Views_AdminGruppe.js",
                    "Views_SpielerEdit.js",
                    "App_Start.js"
                ];

                const version = (typeof CONFIG !== 'undefined' && CONFIG.appVersion) 
                    ? CONFIG.appVersion 
                    : Date.now();

                let loadedCount = 0;

                scripts.forEach(function(src) 
                {
                    const script = document.createElement('script');
                    script.src = src + '?v=' + encodeURIComponent(version);
                    script.async = false;
                    
                    script.onload = function() 
                    {
                        loadedCount++;
                        if (loadedCount === scripts.length) 
                        {
                            if (window.app && typeof window.app.initStart === 'function') 
                            {
                                window.app.initStart();
                            }
                        }
                    };

                    document.head.appendChild(script);
                });
            };

            document.head.appendChild(cfgScript);
        })();
    </script>
</body>
</html>
